services:
  - type: web
    name: tv-alert-relay
    runtime: python
    plan: free
    buildFilter:
      ignoredPaths:
        - backups/**
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: WEB_USER
        sync: false
      - key: WEB_PASSWORD
        sync: false
      - key: TV_SENDER
        value: noreply@tradingview.com
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: HEALTHZ_SHARED_SECRET
        sync: false
