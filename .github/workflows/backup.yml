name: backup

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch export
        env:
          TVALERT_WEB_USER: ${{ secrets.TVALERT_WEB_USER }}
          TVALERT_WEB_PASSWORD: ${{ secrets.TVALERT_WEB_PASSWORD }}
          TVALERT_APP_URL: ${{ secrets.TVALERT_APP_URL }}
        run: |
          mkdir -p backups
          curl --fail --max-time 60 \
            -u "${TVALERT_WEB_USER}:${TVALERT_WEB_PASSWORD}" \
            "${TVALERT_APP_URL%/}/export" -o backups/alerts.json
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/alerts.json
          git diff --cached --quiet || git commit -m "chore: weekly alerts backup"
          git push
